apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-tpu-singlehost-cluster
spec:
  headGroupSpec:
    rayStartParams: {}
    template:
      spec:
        serviceAccountName: ray-ksa
        containers:
          - name: ray-head
            image: us-east5-docker.pkg.dev/tpu-vm-gke-testing/sizhang-repo/ray-torch-tpu:v7
            imagePullPolicy: Always
            env:
            - name: RAY_TRAIN_V2_ENABLED
              value: "1"
            - name: RAY_TPU_V7_RESOURCE_IS_CORES
              value: "True"
            - name: RAY_STORAGE_PATH
              value: "gs://sizhang-tpu-us-east5/ray-experimental"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: hf_token
                  optional: true
            ports:
              - containerPort: 8265  # Dashboard
              - containerPort: 10001 # Client
              - containerPort: 8888  # gRPC
              - containerPort: 8000  # OpenAI API
            resources:
              limits:
                memory: "48Gi"
              requests:
                cpu: "12"
                memory: "48Gi"
  workerGroupSpecs:
    - replicas: 1
      numOfHosts: 1
      groupName: tpu-group
      rayStartParams:
        resources: '"{\"TPU\": 8}"'
      template:
        spec:
          serviceAccountName: ray-ksa
          containers:
            - name: ray-worker
              image: us-east5-docker.pkg.dev/tpu-vm-gke-testing/sizhang-repo/ray-torch-tpu:v7
              imagePullPolicy: Always
              resources:
                limits:
                  memory: "200Gi"
                  google.com/tpu: "4"
                requests:
                  cpu: "48"
                  memory: "200Gi"
                  google.com/tpu: "4"
              env:
                - name: RAY_TRAIN_V2_ENABLED
                  value: "1"
                - name: RAY_TPU_V7_RESOURCE_IS_CORES
                  value: "True"
                - name: RAY_STORAGE_PATH
                  value: "gs://sizhang-tpu-us-east5/ray-experimental"
                # - name: TORCH_TPU_SLICEBUILDER_ADDRESSES
                #   value: "localhost:8471,localhost:8472,localhost:8473,localhost:8474,localhost:8475,localhost:8476,localhost:8477,localhost:8478"
                # - name: TORCH_TPU_TOPOLOGY
                #   value: "2,2,1,2"
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hf-secret
                      key: hf_token
                      optional: true
          nodeSelector:
            cloud.google.com/gke-tpu-accelerator: tpu7x
            cloud.google.com/gke-tpu-topology: 2x2x1
            cloud.google.com/gke-flex-start: "true"
